[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tree"
version = "0.1.0"
description = "Backend tools for constructing Research Tree workspaces."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "langgraph>=1.0",
  # Ranking a paper's chunks against each other is a few hundred dot products
  # over 3072-dimensional embeddings — fast in numpy, slow written by hand.
  "numpy>=2.0.0",
  # Annotation needs the coordinates of every text block and the rectangles a
  # phrase occupies on the page; pypdf reads text but not its geometry.
  "pymupdf>=1.25.0",
  "pypdf>=5.0.0",
  "pydantic>=2.0.0",
  "uvicorn>=0.30.0",
  "fastapi-users[oauth,sqlalchemy]>=15.0",
  "sqlalchemy>=2.0",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "langgraph-checkpoint-postgres>=2.0",
  "azure-storage-blob>=12.20",
  "azure-identity>=1.17",
  "httpx>=0.28.0",
]

[project.scripts]
research-tree-prepare-candidates = "research_tree.cli.prepare_workspace_candidates:main"
research-tree-probe-citation-cutoff = "research_tree.cli.probe_citation_cutoff:main"
research-tree-construct-workspace = "research_tree.cli.construct_workspace:main"
research-tree-enrich-similar-papers = "research_tree.cli.enrich_workspace_similar_papers:main"
research-tree-hydrate-papers = "research_tree.cli.hydrate_workspace_papers:main"
research-tree-restore-workspace-version = "research_tree.cli.restore_workspace_version:main"
research-tree-run-pipeline = "research_tree.cli.run_workspace_pipeline:main"
research-tree-users = "research_tree.cli.manage_users:main"
research-tree-import-data = "research_tree.cli.import_data_to_postgres:main"
research-tree-backup = "research_tree.cli.backup_database:main"
research-tree-migrate = "research_tree.cli.migrate:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
]

pipeline = [
  "sentence-transformers>=3.0.0",
  # Listed directly so the [tool.uv.sources] entry below applies: uv only honours
  # sources for the project's own dependencies, not transitive ones.
  "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# The container image is CPU-only. PyPI's Linux torch wheels pull the CUDA
# toolkit (several GB); the PyTorch CPU index ships the same version without it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
