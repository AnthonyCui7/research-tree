# The production image, run locally against a scratch Postgres.
#
#   docker compose up --build        # API on http://127.0.0.1:8000
#   npm run dev                      # the Vite dev server proxies /api to it
#
# RESEARCH_TREE_AUTH_MODE=none here means the single implicit local user: only
# run it that way on loopback or behind a proxy that does its own sign-in.
# Set it to `accounts` (and SESSION_SECRET in .env) to exercise sign-in locally.
#
# The worker runs builds and annotation jobs off the queue, exactly as in the
# cloud; the api and the worker share the data volume so artifacts written by
# one are readable by the other (Blob Storage plays that part in the cloud).

x-app-environment: &app-environment
  RESEARCH_TREE_DATABASE_URL: postgresql+psycopg://research_tree:research_tree@postgres:5432/research_tree
  RESEARCH_TREE_REDIS_URL: redis://redis:6379/0
  RESEARCH_TREE_DATA_DIR: /data

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      <<: *app-environment
      RESEARCH_TREE_AUTH_MODE: ${RESEARCH_TREE_AUTH_MODE:-none}
      RESEARCH_TREE_PUBLIC_ORIGIN: http://localhost:5173
    volumes:
      - data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["celery", "-A", "research_tree.tasks", "worker", "-B", "--loglevel=info", "--concurrency=2", "-s", "/home/app/celerybeat-schedule"]
    env_file: .env
    environment:
      <<: *app-environment
      RESEARCH_TREE_AUTH_MODE: ${RESEARCH_TREE_AUTH_MODE:-none}
    volumes:
      - data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["research-tree-migrate"]
    environment:
      RESEARCH_TREE_DATABASE_URL: postgresql+psycopg://research_tree:research_tree@postgres:5432/research_tree
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: research_tree
      POSTGRES_PASSWORD: research_tree
      POSTGRES_DB: research_tree
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_tree -d research_tree"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  data:
  postgres:
